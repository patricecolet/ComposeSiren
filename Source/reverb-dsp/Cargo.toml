[package]
name = "reverb-dsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

# Standalone package: not part of any parent workspace.
[workspace]

[lib]
# rlib for Rust binaries and tests; staticlib/cdylib for C, C++, F# and other hosts.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]

[dev-dependencies]
siren-dsp-oracle = { path = "../siren-dsp-oracle" }

# Audio DSP runs on the real-time CoreAudio/ALSA I/O thread even in Debug builds:
# unoptimized Rust (opt-level = 0) takes ~800-1000 ns/sample (~20x slower than C++ -O0)
# and causes audio thread overruns (HALC_ProxyIOContext IOWorkLoop clicks).
[profile.dev]
opt-level = 2

[profile.release]
debug = 1
codegen-units = 1

