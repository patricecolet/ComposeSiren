[package]
name = "composesiren-record"
version = "0.1.0"
description = "Records ComposeSiren's output to FLAC or WAV, from the audio thread, without JUCE"
edition = "2024"
rust-version = "1.88"
publish = false

# A standalone package inside ComposeSiren, not a member of any workspace.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pure Rust encoders: the recorder works wherever the DSP runs, with or
# without JUCE. flacenc without its defaults: no rayon, serde or log.
flacenc = { version = "0.5", default-features = false }
hound = "3.5"
# Lock-free single-producer single-consumer ring: the audio thread's only
# work is a copy into it.
rtrb = "0.4"

[dev-dependencies]
claxon = "0.4"

[build-dependencies]
cbindgen = { version = "0.29.4", default-features = false }

# flacenc unoptimised encodes at 4x real time; optimised, over 100x. Debug
# builds of ComposeSiren build this crate with the dev profile.
[profile.dev]
opt-level = 2

[profile.dev.package.flacenc]
opt-level = 3

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
# Durations and frame counts: never negative.
cast_sign_loss = "allow"
