[package]
name = "mecaviv-bridge-composesiren"
version = "0.1.0"
description = "ComposeSiren's park bridge: drives the sirens from SirenOrchestra, with a C ABI and a C++ wrapper"
edition = "2024"
rust-version = "1.85"
publish = false

# A standalone package inside ComposeSiren, not a member of any workspace.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# mecaviv-rs is expected to be checked out next to ComposeSiren.
mecaviv-v1 = { path = "../../../mecaviv-rs/crates/mecaviv-v1" }
# Only the client protocol: not the daemon's virtual MIDI port (midir, and on Linux
# libasound symbols a plugin cannot leave unresolved).
mecaviv-bridge-daemon = { path = "../../../mecaviv-rs/crates/mecaviv-bridge-daemon", default-features = false }

[build-dependencies]
cbindgen = { version = "0.29.4", default-features = false }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
